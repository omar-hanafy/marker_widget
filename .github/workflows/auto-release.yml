name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_PAT }}

      - name: Validate lane and detect version change
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package=$(awk '/^name:/ {print $2}' pubspec.yaml)
          version=$(awk '/^version:/ {print $2}' pubspec.yaml)
          if [[ -z "$package" || -z "$version" ]]; then
            echo "Failed to read package name or version from pubspec.yaml"
            exit 1
          fi

          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Version $version is not a valid semantic version."
            exit 1
          fi

          version_without_build="${version%%+*}"
          if [[ "${GITHUB_REF_NAME}" == "main" && "$version_without_build" == *-* ]]; then
            echo "Main requires a stable version (no pre-release suffix)."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "dev" && "$version_without_build" != *-* ]]; then
            echo "Dev requires a pre-release version suffix (e.g. -dev.1)."
            exit 1
          fi

          before="${{ github.event.before }}"
          old_version=""
          if [[ ! "$before" =~ ^0+$ ]] &&
             git cat-file -e "${before}:pubspec.yaml" 2>/dev/null; then
            old_version=$(git show "${before}:pubspec.yaml" | awk '/^version:/ {print $2}')
          fi

          if [[ "$old_version" == "$version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version remains $version; no release will be created."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed from ${old_version:-<none>} to $version."
          fi
          echo "tag=${package}-v${version}" >> "$GITHUB_OUTPUT"

      - name: Fail if tag exists
        if: steps.release.outputs.changed == 'true'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists. Bump version and re-run."
            exit 1
          fi

      - name: Create and push tag
        if: steps.release.outputs.changed == 'true'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

      - name: Create GitHub release
        if: steps.release.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.ref_name == 'dev' }}
