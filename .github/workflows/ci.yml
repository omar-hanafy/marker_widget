name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version channel check
        env:
          RELEASE_LANE: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml)
          version_without_build="${version%%+*}"
          if [[ "$RELEASE_LANE" == "main" && "$version_without_build" == *-* ]]; then
            echo "Main requires a stable version (no pre-release suffix)."
            exit 1
          fi
          if [[ "$RELEASE_LANE" == "dev" && "$version_without_build" != *-* ]]; then
            echo "Dev requires a pre-release version suffix (e.g. -dev.1)."
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Validate agent plugin
        run: dart run tool/validate_agent_plugin.dart

      - name: Test
        run: flutter test

  test-minimum:
    name: Test minimum SDK and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Resolve lowest supported dependencies
        run: dart pub downgrade

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          channel: beta

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.14

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .
